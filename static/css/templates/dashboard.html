{% extends "base.html" %}

{% block title %}Dashboard - University System{% endblock %}

{% block content %}
<h2 class="mb-4">Dashboard</h2>

<div class="row">
    <div class="col-md-4">
        <div class="card text-white bg-success mb-3">
            <div class="card-body">
                <h5 class="card-title">My Courses</h5>
                <p class="card-text">View and manage your enrolled courses.</p>
                <a href="#" class="btn btn-light">Go</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-info mb-3">
            <div class="card-body">
                <h5 class="card-title">Assignments</h5>
                <p class="card-text">Check your assignments and deadlines.</p>
                <a href="#" class="btn btn-light">Go</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-warning mb-3">
            <div class="card-body">
                <h5 class="card-title">Profile</h5>
                <p class="card-text">Update your personal information.</p>
                <a href="{{ url_for('profile') }}" class="btn btn-light">Go</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
